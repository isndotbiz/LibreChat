services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mongodb
      - hydra-pgvector
      - redis
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - APP_TITLE=HYDRA Enterprise
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - PG_DSN=${HYDRA_PG_DSN:-postgresql://${PG_USER:-hydra}:${PG_PASSWORD}@hydra-pgvector:5432/${PG_DB:-research}}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - REDIS_URI=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - CREDS_KEY=${CREDS_KEY}
      - CREDS_IV=${CREDS_IV}
      - CONFIG_PATH=/app/librechat.yaml
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./api/hydra:/app/hydra:ro
      - ${HYDRA_SRC:-../llm-security-research}/src/lib:/app/hydra/lib:ro
      - uploads:/app/client/public/images
    networks:
      - hydra-net

  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - hydra-net

  hydra-pgvector:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-hydra}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB:-research}
    volumes:
      - hydra_pgvector_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-hydra}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hydra-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hydra-net

  dashboard:
    build:
      context: ${HYDRA_SRC:-../llm-security-research}
      dockerfile: ${PWD}/Dockerfile.dashboard
    restart: unless-stopped
    depends_on:
      hydra-pgvector:
        condition: service_healthy
    environment:
      - PG_DSN=${HYDRA_PG_DSN:-postgresql://${PG_USER:-hydra}:${PG_PASSWORD}@hydra-pgvector:5432/${PG_DB:-research}}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - PORT=8091
    networks:
      - hydra-net

  telegram-bot:
    image: python:3.12-slim
    restart: unless-stopped
    depends_on:
      - hydra-pgvector
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
      - PG_DSN=${HYDRA_PG_DSN:-postgresql://${PG_USER:-hydra}:${PG_PASSWORD}@hydra-pgvector:5432/${PG_DB:-research}}
    volumes:
      - ./hydra-telegram/bot.py:/app/bot.py:ro
    command: bash -c "pip install --quiet python-telegram-bot httpx psycopg2-binary && python /app/bot.py"
    networks:
      - hydra-net
    profiles:
      - telegram

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
      - dashboard
    networks:
      - hydra-net

volumes:
  mongo_data:
  hydra_pgvector_data:
  redis_data:
  uploads:

networks:
  hydra-net:
    driver: bridge
