version: 1.3.6
cache: true

interface:
  customWelcome: "Welcome to HYDRA Enterprise."
  privacyPolicy:
    externalUrl: ""
  termsOfService:
    externalUrl: ""
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  fileCitations: true

registration:
  socialLogins: []
  allowedDomains: []

endpoints:
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_API_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "deepseek/deepseek-chat"
          - "deepseek/deepseek-v3.2"
          - "deepseek/deepseek-r1"
          - "mistralai/mistral-large-2512"
          - "qwen/qwen3-235b-a22b"
          - "anthropic/claude-sonnet-4.6"
          - "openai/gpt-5"
          - "openai/o3"
          - "meta-llama/llama-4-maverick"
          - "nousresearch/hermes-4-70b"
          - "x-ai/grok-4"
          - "google/gemini-2.5-pro"
        fetch: false
      titleConvo: true
      titleModel: "deepseek/deepseek-chat"
      dropParams:
        - "user"
        - "stop"
      modelDisplayLabel: "HYDRA Models"

# LibreChat supports exactly one active provider for each speech direction.
speech:
  tts:
    elevenlabs:
      apiKey: "${ELEVENLABS_API_KEY}"
      model: "eleven_turbo_v2_5"
      voices:
        - "21m00Tcm4TlvDq8ikWAM"
  stt:
    openai:
      apiKey: "${OPENAI_API_KEY}"
      model: "whisper-1"
      url: "https://api.openai.com/v1/audio/transcriptions"
  speechTab:
    textToSpeech: true
    speechToText: true

mcpSettings:
  allowedDomains:
    - "localhost"
    - "127.0.0.1"
    - "host.docker.internal"

mcpServers:
  hydra_dashboard:
    type: sse
    url: "http://localhost:8091/api/mcp/sse"
    timeout: 30000
  hydra_rag:
    type: sse
    url: "http://localhost:8092/mcp/sse"
    timeout: 30000

actions:
  allowedDomains:
    - "openrouter.ai"
    - "localhost"
    - "127.0.0.1"
