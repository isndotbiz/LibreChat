# TrueNAS override — connects to external PostgreSQL and Ollama
# Usage: docker compose -f docker-compose.hydra.yml -f docker-compose.truenas.yml up -d

services:
  api:
    environment:
      - PG_DSN=postgresql://jdmal:${POSTGRES_PASSWORD}@postgresql:5432/research
    networks:
      - hydra-net
      - databases

  dashboard:
    environment:
      - PG_DSN=postgresql://jdmal:${POSTGRES_PASSWORD}@postgresql:5432/research
      - OLLAMA_URL=http://ollama:11434
    networks:
      - hydra-net
      - databases

  # Disable local pgvector — use external PostgreSQL instead
  hydra-pgvector:
    profiles:
      - disabled

  rag-mcp:
    image: python:3.12-slim
    restart: unless-stopped
    environment:
      - PG_DSN=postgresql://jdmal:${POSTGRES_PASSWORD}@postgresql:5432/research
      - OLLAMA_URL=http://ollama:11434
      - PORT=8092
    volumes:
      - ${HYDRA_SRC:-../llm-security-research}/src/lib:/app/src/lib:ro
      - ${HYDRA_SRC:-../llm-security-research}/rag:/app/rag:ro
    command: >
      bash -c "pip install --quiet fastapi uvicorn psycopg2-binary httpx &&
               cd /app && python -m uvicorn rag.mcp_server:app --host 0.0.0.0 --port 8092"
    networks:
      - hydra-net
      - databases

networks:
  databases:
    external: true
